<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentShop AI | Auditoría de tiendas online</title><style>*{box-sizing:border-box}body{margin:0;background:#0f172a;font-family:system-ui,-apple-system,Arial,sans-serif;color:#172033}.wrap{max-width:650px;margin:30px auto;padding:22px}.hero{text-align:center;color:white;margin-bottom:25px}h1{font-size:2rem;margin:8px}p{line-height:1.6}.card{background:white;border-radius:24px;padding:28px;box-shadow:0 12px 35px #0002}label{display:block;font-weight:700;margin:22px 0 8px}input,select{display:block;width:100%;padding:16px;font-size:16px;border:1px solid #cbd5e1;border-radius:12px;background:white}button{width:100%;margin-top:28px;border:0;border-radius:12px;background:#3462f5;color:white;font-size:17px;font-weight:700;padding:18px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#estado{margin-top:20px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}#estado.error{color:#b91c1c}#estado.ok{color:#166534}small{display:block;margin-top:22px;color:#64748b;line-height:1.5}</style></head><body><main class="wrap"><div class="hero"><h1>AgentShop AI</h1><p>Analiza tu tienda online con inteligencia artificial</p></div><section class="card"><h2>Solicita tu análisis</h2><form id="form"><label for="url">Dirección de tu tienda online</label><input id="url" type="url" placeholder="https://tutienda.com" required><label for="email">Correo electrónico</label><input id="email" type="email" placeholder="tu@correo.com" required><label for="plataforma">¿Qué plataforma utilizas?</label><select id="plataforma"><option>Shopify</option><option>WooCommerce</option><option>Otra</option></select><button id="boton" type="submit">Analizar mi tienda →</button></form><div id="estado" role="status" aria-live="polite"></div><small>El análisis requiere que la función «analyze» esté publicada y configurada en Netlify. No introduzcas contraseñas ni datos confidenciales.</small></section></main><script>const form=document.getElementById('form'),estado=document.getElementById('estado'),boton=document.getElementById('boton');form.addEventListener('submit',async e=>{e.preventDefault();estado.className='';estado.textContent='Conectando con el servicio de análisis…';boton.disabled=true;const url=document.getElementById('url').value.trim(),email=document.getElementById('email').value.trim(),platform=document.getElementById('plataforma').value;try{const respuesta=await fetch('/.netlify/functions/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,email,platform,plataforma:platform})});const raw=await respuesta.text();let data;try{data=JSON.parse(raw)}catch{data={message:raw.slice(0,400)}}if(!respuesta.ok)throw new Error(data.error||data.message||'Error HTTP '+respuesta.status);estado.className='ok';const resultado=data.analysis??data.result??data.report??data.message??data;estado.textContent='Análisis recibido:\n\n'+(typeof resultado==='string'?resultado:JSON.stringify(resultado,null,2));}catch(err){estado.className='error';estado.textContent='No se pudo completar el análisis: '+err.message+'\n\nSi aparece «404» o «Failed to fetch», la función analyze aún no está disponible en este despliegue.'}finally{boton.disabled=false}});</script></body></html>
